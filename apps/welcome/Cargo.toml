[package]
name = "draftos-welcome"
description = "DraftOS Hello — first-run welcome and onboarding (libcosmic)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "draftos-welcome"
path = "src/main.rs"

[dependencies]
draftos-common.workspace = true
libcosmic = { workspace = true, features = [
    "winit",
    "tokio",
    "xdg-portal",
    "single-instance",
    "wgpu",
    "wayland",
] }

# DraftOS live initramfs config. Same as archiso releng, with the `plymouth`
# hook added (after `kms`, so the DRM driver is up) to draw the boot splash and
# hide kernel/systemd console output on the live medium.
HOOKS=(base udev microcode modconf kms plymouth memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)

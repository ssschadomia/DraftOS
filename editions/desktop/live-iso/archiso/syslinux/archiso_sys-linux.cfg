# No speech/accessibility entry: the speakup stack (espeakup/alsa-utils) is not
# shipped and COSMIC has no speakup story — advertising a silent entry would be
# worse than none. Revisit with a real COSMIC a11y setup (orca).
LABEL arch
TEXT HELP
Boot the DraftOS live desktop.
Try DraftOS, then run "Install DraftOS" to install it.
ENDTEXT
MENU LABEL DraftOS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

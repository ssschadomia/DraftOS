# pacman.conf for building the DraftOS Desktop live ISO (archiso).
# Stock Arch repositories only — the Desktop edition installs a normal Arch
# system with our own engine, so no third-party repo or keyring is required.

[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
SigLevel     = Required DatabaseOptional
LocalFileSigLevel = Optional
# Download via curl so a stalled mirror is dropped (and the next Server tried)
# instead of aborting the whole build with "Operation too slow". This replaces
# pacman's internal fetcher, so ParallelDownloads no longer applies.
XferCommand = /usr/bin/curl -L -C - -f -o %o %u --connect-timeout 20 --retry 3 --retry-connrefused --retry-delay 2 --speed-limit 2000 --speed-time 20

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

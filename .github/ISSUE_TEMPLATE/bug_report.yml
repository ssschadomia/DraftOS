name: Bug report
description: Something in DraftOS isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please **do not** report
        security issues here — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Desktop
        - Immutable
        - Not sure / building from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "e.g. 0.1.0, or a git commit hash"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant terminal output, `journalctl`, or app logs.
      render: shell

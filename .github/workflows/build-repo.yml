name: Build & publish the DraftOS pacman repo

# Builds the DraftOS packages (branding, apps, core), signs them and the repo db
# with the DraftOS packaging key, and mirrors the [draftos] repo to Cloudflare R2
# under repo/x86_64/. Consumed by installed systems via `pacman -Syu`.
#
# Required repository secrets:
#   DRAFTOS_GPG_PRIVATE_KEY  — ASCII-armored private signing key
#   DRAFTOS_GPG_KEYID        — its long key id / fingerprint
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET

on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'apps/**'
      - 'crates/**'
      - '.github/workflows/build-repo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-repo:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install toolchain
        # rust + git + rclone, plus the libcosmic build deps (smithay-client-
        # toolkit needs xkbcommon.pc etc.) — same set the ISO builder image ships.
        run: |
          pacman -Sy --needed --noconfirm \
            rust git rclone \
            libxkbcommon wayland mesa vulkan-icd-loader fontconfig freetype2 expat

      - uses: actions/checkout@v4

      - name: Build packages + repo (signed)
        env:
          KEYID: ${{ secrets.DRAFTOS_GPG_KEYID }}
          PRIV: ${{ secrets.DRAFTOS_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder .
          # Import the signing key for the builder user.
          printf '%s' "$PRIV" > /tmp/key.asc
          su builder -c "gpg --batch --import /tmp/key.asc"
          rm -f /tmp/key.asc

          export CARGO_TARGET_DIR=/tmp/draftos-target
          su builder -c "cargo build --release -p draftos-welcome -p draftos-store -p draftos-media-writer -p draftos-cli"

          P=packaging/draftos-apps/payload
          rm -rf "$P"; mkdir -p "$P/bin" "$P/desktop" "$P/icons"
          cp "$CARGO_TARGET_DIR"/release/draftos-welcome \
             "$CARGO_TARGET_DIR"/release/draftos-store \
             "$CARGO_TARGET_DIR"/release/draftos-media-writer \
             "$CARGO_TARGET_DIR"/release/draftos "$P/bin/"
          for d in apps/*/data/*.desktop; do cp "$d" "$P/desktop/"; done
          for i in apps/*/data/*.svg;     do cp "$i" "$P/icons/";   done
          rm -f "$P/desktop/org.draftos.Installer.desktop" "$P/icons/org.draftos.Installer.svg"

          REPO="packaging/out/repo/x86_64"
          rm -rf packaging/out; mkdir -p "$REPO"
          chown -R builder packaging
          for pkg in draftos-branding draftos-apps draftos-core; do
            su builder -c "cd packaging/$pkg && makepkg -dfc --noconfirm --nodeps --sign --key $KEYID"
            cp packaging/$pkg/*.pkg.tar.zst packaging/$pkg/*.pkg.tar.zst.sig "$REPO/"
          done
          su builder -c "cd $REPO && repo-add --sign --key $KEYID draftos.db.tar.zst *.pkg.tar.zst"
          ls -lh "$REPO"

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          region = auto
          EOF

      - name: Publish repo to R2
        env:
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          SRC="packaging/out/repo/x86_64"
          if [ ! -f "$SRC/draftos.db" ] && [ ! -f "$SRC/draftos.db.tar.zst" ]; then
            echo "::error::repo db missing — refusing to sync"; exit 1
          fi
          # sync keeps the prefix bounded (old package versions drop out) —
          # storage stays inside the R2 free tier.
          # --copy-links: repo-add makes draftos.db / draftos.files SYMLINKS to
          # the .tar.zst; object storage has no symlinks, so upload them as real
          # objects (pacman requests draftos.db by that exact name).
          rclone sync -L "$SRC" "r2:${BUCKET}/repo/x86_64" \
            --s3-no-check-bucket --transfers 8 --checkers 16
          rclone size "r2:${BUCKET}" || true

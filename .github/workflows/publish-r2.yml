name: Publish artifacts to R2

# Mirrors GitHub Release assets to the Cloudflare R2 bucket so downloads are
# served from Cloudflare's CDN (no egress fees). Also runnable manually to push
# an arbitrary directory (e.g. a freshly built pacman/flatpak repo).
#
# Required repository secrets:
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_dir:
        description: "Local directory to upload"
        required: true
        default: "dist"
      prefix:
        description: "Remote prefix in the bucket (e.g. iso, repo/x86_64)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Install rclone
        run: |
          sudo -v
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Download release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist/iso
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist/iso --pattern '*' || true

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          region = auto
          EOF

      - name: Upload to R2
        env:
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            SRC="dist/iso"; PREFIX="iso"
          else
            SRC="${{ github.event.inputs.source_dir }}"; PREFIX="${{ github.event.inputs.prefix }}"
          fi
          echo ">> uploading $SRC -> r2:$BUCKET/$PREFIX"
          rclone copy "$SRC" "r2:${BUCKET}/${PREFIX}" \
            --s3-no-check-bucket --transfers 8 --checkers 16 --s3-chunk-size 64M

# DraftOS Rust workspace.
#
# Every Rust component in the repo (CLI tools, libcosmic GUI apps, shared
# libraries) is a member of this single workspace so they share one dependency
# graph, one lockfile, and one `cargo build`. Add new members under members[]
# as they are created (crates/, apps/, cli/).

[workspace]
resolver = "2"
members = [
    "crates/draftos-common",
    "crates/draftos-install",
    "apps/welcome",
    "apps/installer",
    "apps/media-writer",
    "apps/store",
    "cli/draftos",
    # "crates/draftos-link",
    # "cli/draftbox",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ssschadomia/DraftOS"
authors = ["DraftOS contributors"]

# Dependencies shared across members are pinned here once and referenced with
# `foo.workspace = true` in each crate, keeping versions consistent repo-wide.
[workspace.dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util"] }
# libcosmic apps are pulled from the COSMIC git repo, pinned to one revision so
# every GUI app tracks the same libcosmic API. This rev (v1.0.0) is the one
# verified working in the prior iteration. Apps opt into the feature set they need.
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "dc1cf9f00cbe2902a52166492654bb9fee8a73d1", default-features = false }
draftos-common = { path = "crates/draftos-common" }
draftos-install = { path = "crates/draftos-install" }
# App-center catalog parsing: AppStream XML (fast, zero-copy DOM) + gzip.
roxmltree = "0.20"
flate2 = "1"

[profile.release]
lto = "thin"
strip = true

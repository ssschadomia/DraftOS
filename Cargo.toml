# DraftOS Rust workspace.
#
# Every Rust component in the repo (CLI tools, libcosmic GUI apps, shared
# libraries) is a member of this single workspace so they share one dependency
# graph, one lockfile, and one `cargo build`. Add new members under members[]
# as they are created (crates/, apps/, cli/).

[workspace]
resolver = "2"
members = [
    # "crates/draftos-common",
    # "crates/draftos-link",
    # "cli/draftos",
    # "cli/draftbox",
    # "apps/store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/schadomia/DraftOS"
authors = ["DraftOS contributors"]

# Dependencies shared across members are pinned here once and referenced with
# `foo.workspace = true` in each crate, keeping versions consistent repo-wide.
[workspace.dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# libcosmic apps are pulled from the COSMIC git repo; pin the ref when the first
# GUI crate lands so all apps track the same libcosmic revision.
# libcosmic = { git = "https://github.com/pop-os/libcosmic" }

[profile.release]
lto = "thin"
strip = true
